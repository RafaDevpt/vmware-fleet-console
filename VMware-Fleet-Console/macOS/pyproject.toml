# PT-PT: Metadados do projecto e configuracao das ferramentas.
# EN-UK: Project metadata and tool configuration.
#
# Created by Redfox using Claude

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vmware-fleet-console-macos"
version = "2.0.0"
description = "Estado, manutencao e exportacao OVF de vCenter e ESXi, com interface grafica / vCenter and ESXi state, maintenance and OVF export, with a graphical interface"
readme = "LEIA-ME.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Rafael Santos (Redfox)" }]
keywords = ["vmware", "vsphere", "vcenter", "esxi", "pyvmomi", "ovf", "export", "backup", "gui", "tkinter", "sysadmin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Portuguese",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Monitoring",
]
# PT-PT: O Tkinter da janela vem do sistema (python3-tk e afins, ou o Python
#        do python.org); não é um pacote do pip e por isso não aparece aqui.
# EN-UK: The window's Tkinter comes from the system (python3-tk and kin, or
#        python.org's Python); not a pip package, hence absent here.
dependencies = [
    "pyvmomi>=8.0.2,<9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
vfc = "vfc.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
# PT-PT: E501 fica de fora porque os comentarios bilingues sao naturalmente
#        longos, e cortar frases a meio para caber tornaria-os ilegiveis.
# EN-UK: E501 is excluded because the bilingual comments are naturally long,
#        and breaking sentences to fit would make them unreadable.
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
